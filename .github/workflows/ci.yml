name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run quality checks
        run: |
          python -m ruff check src tests examples
          python -m ruff check --select I src tests examples
          python -m ruff format --check src tests examples
          bash -n examples/tensor_debug/cli/workflows.sh
          bash -n examples/memory_debug/cli/workflows.sh

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt numpy torch

      - name: Run Python tests
        run: |
          python -m py_compile $(find src tests examples -name '*.py')
          python -m pytest -q tests

  package:
    name: Source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build and check sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m build --sdist
          python -m twine check dist/*

      - name: Run the test suite from the unpacked sdist
        run: |
          python -m pip install numpy torch
          mkdir -p /tmp/sdist-check
          tar -xzf dist/*.tar.gz -C /tmp/sdist-check
          cd /tmp/sdist-check/torch_cudagraph_debug-*
          python -m pytest -q tests

      - name: Verify the no-tensor-collection install from the sdist
        run: |
          python -m venv /tmp/ntc-venv
          . /tmp/ntc-venv/bin/activate
          python -m pip install --upgrade pip
          TCGD_NO_TENSOR_COLLECTION=1 python -m pip install dist/*.tar.gz
          python -c "from torch_cudagraph_debug import _native; assert not _native.extension_available()"
          python -m pip install -r requirements-dev.txt numpy
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 TCGD_TEST_INSTALLED=1 python -m pytest -q tests
