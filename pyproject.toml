[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-cudagraph-debug"
version = "0.2.0"
description = "CUDA Graph tensor and allocator memory debugging for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.6",
]
authors = [{ name = "torch-cudagraph-debug contributors" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["cuda", "cuda-graphs", "debugging", "memory", "pytorch", "tensor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/buptzyb/torch-cudagraph-debug"
Source = "https://github.com/buptzyb/torch-cudagraph-debug"
Issues = "https://github.com/buptzyb/torch-cudagraph-debug/issues"

[project.scripts]
tcgd-memory = "torch_cudagraph_debug.memory_debug.cli:main"
tcgd-tensor = "torch_cudagraph_debug.tensor_debug.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torch_cudagraph_debug = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
  "gpu: tests that require a CUDA-enabled PyTorch runtime",
]
